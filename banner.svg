<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Umais Nisar — I make the web move">
  <style>
    .drift { animation: drift 6s ease-in-out infinite alternate; }
    .drift.d2 { animation-delay: 1.5s; }
    .drift.d3 { animation-delay: 3s; }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(6px, -8px); }
    }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .pulse.d2 { animation-delay: 1s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.9; }
    }
    .caret { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.1; }
    }
    .spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 14s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="300" fill="#0f0f0e"/>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.4" fill="#bf5fff" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g class="drift">
    <circle class="pulse" cx="880" cy="90" r="3" fill="#bf5fff"/>
    <circle cx="1020" cy="200" r="2.2" fill="#bf5fff" fill-opacity="0.5"/>
  </g>
  <g class="drift d2">
    <circle class="pulse d2" cx="960" cy="150" r="2.6" fill="#bf5fff" fill-opacity="0.7"/>
    <circle cx="1100" cy="80" r="2" fill="#e9e7e1" fill-opacity="0.4"/>
  </g>
  <g class="drift d3">
    <circle cx="820" cy="230" r="2.4" fill="#bf5fff" fill-opacity="0.6"/>
    <circle class="pulse" cx="1130" cy="240" r="2.8" fill="#bf5fff" fill-opacity="0.8"/>
  </g>

  <text x="48" y="52" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="4" fill="#8f8d85">UMAIS NISAR ©</text>
  <text x="1152" y="52" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="4" fill="#8f8d85">TORONTO — ET</text>

  <text x="46" y="152" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="66" letter-spacing="-1" fill="#e9e7e1">I MAKE THE WEB</text>
  <text x="46" y="232" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="72" fill="#e9e7e1">move</text>
  <rect class="caret" x="230" y="196" width="26" height="38" fill="#bf5fff"/>

  <text x="48" y="272" font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="4" fill="#8f8d85">SENIOR SOFTWARE ENGINEER — .NET / BLAZOR ✕ CREATIVE FRONTEND</text>
  <text class="spin" x="1130" y="278" font-family="Arial, sans-serif" font-size="26" fill="#bf5fff">✺</text>
</svg>
